<fieldset>
    <legend routerLink="/">Эксперт-сервис</legend>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <label for="username">Логин</label>
        <input type="text" 
            formControlName="username" 
            [ngClass]="{ 'is-invalid': submitted && loginForm.controls['username'].errors }" 
        />
        @if (submitted && loginForm.controls['username'].errors) {
            @if (loginForm.controls['username'].errors['required']) {
                <div class="login-page-error">Необходимо ввести логин</div>
            }
        }
        <label for="password">Пароль</label>
        <input type="password"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && loginForm.controls['password'].errors }" 
        />
        @if (submitted && loginForm.controls['password'].errors) {
            <div class="login-page-error">Необходимо ввести пароль</div>
        }
        <button [disabled]="loading">Войти</button>
        @if (error) {
            <div class="login-page-error">{{ error }}</div>
        }
    </form>
</fieldset>
