@if (serverError) {
  <fieldset>
    <legend>Заказ удалён, или произошла ошибка</legend>
  </fieldset>
} @else {
  <fieldset>
    <legend>Заказ</legend>
    <form [formGroup]="orderDetailsForm" (ngSubmit)="onSubmit()">
      <label for="id">Id:</label>
      <input id="id" formControlName="id" type="number">

      <label for="order_id">Order id:</label>
      <input id="order_id" formControlName="order_id" type="number">

      <label for="user_id">author:</label>
      <input id="user_id" formControlName="author" type="number">

      <label for="details">Подробности:</label>
      <textarea id="details" formControlName="details"></textarea>

      <label for="hidden">Скрыт:</label>
      <input id="hidden" formControlName="hidden" type="checkbox">

      <label for="created_at">Создан:</label>
      <input id="created_at" formControlName="created_at" type="datetime-local">

      <label for="updated_at">Обновлён:</label>
      <input id="updated_at" formControlName="updated_at" type="datetime-local">

      <label for="updated_at">Удалён:</label>
      <input id="deleted_at" formControlName="deleted_at" type="datetime-local">

      <div class="btn-group">
        @if ((orderDetailsItem$$ | async)?.id) {
          <button type="submit" [disabled]="!orderDetailsForm.valid">Сохранить изменения</button>
          <button type="button" (click)="onDelete()">Удалить заказ</button>
        } @else {
          <button type="submit" [disabled]="!orderDetailsForm.valid">Создать заказ</button>
        }
      </div>
    </form>
  </fieldset>
