<div class="how-we-works__wrapper">
  <div class="how-we-works__title h2 with-mb">Как мы работаем</div>
  <div class="how-we-works__grid">
    @for (item of data; track item) {
      <div class="how-we-works-tile">
        @if (typeof item.icon !== 'string') {
          <div class="how-we-works-tile__icon">{{ item.icon?.character }}</div>
        }
        <div class="how-we-works-tile__title">{{ item.title }}</div>
      </div>
    }
  </div>
</div>
