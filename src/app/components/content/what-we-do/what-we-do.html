<div class="what-we-do__wrapper">
  <div class="what-we-do__grid">
    @for (item of data; track item) {
      @if (item.route) {
        <a class="what-we-do-tile" [routerLink]="['/', item.route]">
          <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
        </a>
      } @else {
        <div class="what-we-do-tile">
          <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
        </div>
      }
    }
  </div>
</div>

<ng-template #itemTemplate let-item>
  <!-- @if (item.icon.character) {
    <span class="what-we-do-tile__icon">{{ item.icon.character }}</span>
  } -->
  
  <svg>
    <use [attr.href]="'/images/products.svg#icon_'+item?.icon?.link"></use>
  </svg>

  <!-- @else if (item.icon.link) {
    <svg viewBox="0 0 44.4 44.4">
      <use [attr.href]="'#'+item.icon.link"></use>
    </svg>
  } -->
  <div class="what-we-do-tile__title">{{ item.icon.title }}</div>
</ng-template>
